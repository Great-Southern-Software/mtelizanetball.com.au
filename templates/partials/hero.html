{@io.quarkiverse.roq.frontmatter.runtime.model.Site site}
<section class="hero">
  <div class="photo" style="background-image: url('{=site.image('hero-team.jpg')}')"></div>
  <div class="scrim"></div>
  <div class="container">
    <div class="content">
      <p class="eyebrow">Mornington Peninsula &middot; Est. 1968</p>
      <h1>Play netball.<br>Make <em>mates</em>.</h1>
      <p class="lead">Mt Eliza Netball Club is family netball at its best, from first passes at NetSetGO to Saturday battles in the Open division.</p>
      <div class="actions">
        <a class="btn btn-gold" href="https://registration.netballconnect.com/userRegistration?organisationId=799dc8d1-75f6-465b-98e5-0dffe8ced073&amp;competitionId=afa1cda0-bfde-40cf-9f12-b7c144693684">Register for Spring 2026</a>
        <a class="btn btn-outline" href="{=site.url('season')}">Season info</a>
      </div>
      <div class="flyer">
        <img src="{=site.image('spring-2026-flyer.jpg')}" alt="Spring Season Netball flyer. Mt Eliza Netball Club is inviting new players for a short 10-week season, October to mid-December. Games on Saturdays at Jubilee Park. For more information email secretary.menc@gmail.com." width="1024" height="1536" loading="lazy">
      </div>
    </div>
  </div>
</section>
