name: Roq Site Deploy

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 5 * * *"  # Daily at 05:00 UTC to publish scheduled content
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh fixtures from NetballConnect
        # Best effort: if NetballConnect is down or changes shape, the build
        # falls back to the data/fixtures.json committed in the repo.
        continue-on-error: true
        run: python3 scripts/fetch_fixtures.py
      - name: Generate Roq Site
        uses: quarkiverse/quarkus-roq@v1.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}   # Used to automatically get the GitHub Pages url
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
