name: PR Build Check

# Gives pull requests a CI gate: github-worker refuses to auto-merge a PR
# with no checks, and deploy.yml only runs on push to main. Same Roq build
# as the deploy, without the Pages deployment.
on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh fixtures from NetballConnect
        # Best effort: if NetballConnect is down or changes shape, the build
        # falls back to the data/fixtures.json committed in the repo.
        continue-on-error: true
        run: python3 scripts/fetch_fixtures.py
      - name: Generate Roq Site
        uses: quarkiverse/quarkus-roq@v1.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
